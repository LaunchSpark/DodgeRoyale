<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f0e6" />
    <meta name="description" content="A little square. A lot of space. Explore the first Dodge Royale world." />
    <link rel="icon" href="data:," />
    <title>Dodge Royale — The world</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        color: #18374a;
        background: #f3f0e6;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body { width: 100%; height: 100%; margin: 0; }
      body { padding: 0 24px; overflow: hidden; }

      .shell {
        display: grid;
        grid-template-rows: 80px minmax(0, 1fr) 64px;
        height: 100%;
        height: 100dvh;
      }

      .topbar, .footer, .brand, .controls, .footer-actions {
        display: flex;
        align-items: center;
      }

      .topbar, .footer { justify-content: space-between; gap: 24px; }
      .brand { gap: 12px; }

      .brand-mark {
        display: block;
        width: 22px;
        height: 22px;
        background: #2b89bd;
        box-shadow: 4px 4px 0 #18374a;
        margin-right: 4px;
      }

      h1 { margin: 0; font-family: Arial, Helvetica, sans-serif; line-height: 0.9; }
      .brand-name { font-size: 25px; font-weight: 900; letter-spacing: -1.2px; }
      .brand-name span { font-weight: 400; }
      .edition { margin: 7px 0 0; font-size: 9px; letter-spacing: 2px; }
      .tagline { margin: 0; font-size: 11px; color: #52666e; }

      #game-viewport {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #2b89bd;
        border: 1px solid #18374a;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #game:focus-visible { outline: 2px solid #f3f0e6; outline-offset: -5px; }

      .loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #2b89bd;
        color: #fff9e9;
      }

      .loading-content { max-width: 520px; text-align: center; }
      .loading-square {
        display: block;
        width: 26px;
        height: 26px;
        margin: 0 auto 24px;
        background: #fff9e9;
        box-shadow: 4px 4px 0 #18374a;
        animation: waiting 1s ease-in-out infinite alternate;
      }

      .loading-title { margin: 0; font-size: 15px; font-weight: 500; }
      .loading-detail { margin: 12px 0 0; font-size: 11px; line-height: 1.7; overflow-wrap: anywhere; }
      .loading.failed .loading-square { animation: none; }

      .controls { flex-wrap: wrap; gap: 9px; font-size: 11px; }
      .footer-actions { gap: 12px; flex-shrink: 0; }
      .controls-label { margin-right: 5px; color: #52666e; }
      kbd { font: inherit; padding: 5px 7px; border: 1px solid #b4bcb8; border-bottom-width: 2px; }

      button {
        font: inherit;
        font-size: 11px;
        color: inherit;
        background: transparent;
        padding: 8px 0 8px 12px;
        border: 0;
        cursor: pointer;
        white-space: nowrap;
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      button:hover { color: #2b89bd; }
      button:focus-visible { outline: 2px solid #2b89bd; outline-offset: 4px; }
      noscript { display: block; padding: 24px; }

      @keyframes waiting { to { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .loading-square { animation: none; } }
      @media (max-width: 600px) {
        body { padding: 0 12px; }
        .shell { grid-template-rows: 68px minmax(0, 1fr) 90px; }
        .tagline { display: none; }
        .topbar, .footer { gap: 8px; }
        .footer { flex-wrap: wrap; align-content: center; }
        .footer-actions { width: 100%; justify-content: space-between; }
        .controls { gap: 6px; font-size: 10px; }
        .controls-label { display: none; }
        button { font-size: 10px; padding: 2px 0; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1 class="brand-name">DODGE<span>ROYALE</span></h1>
            <p class="edition">WORLD PROTOTYPE</p>
          </div>
        </div>
        <p class="tagline">A little square. A lot of space.</p>
      </header>

      <section id="game-viewport" aria-label="Game viewport">
        <canvas id="game" width="1" height="1" tabindex="0" aria-label="Dodge Royale. Move your player through the world." aria-describedby="controls">
          A browser with canvas, WebGL 2, and WebAssembly support is required to play.
        </canvas>
        <div id="loading" class="loading" role="status" aria-live="polite">
          <div class="loading-content">
            <span class="loading-square" aria-hidden="true"></span>
            <h2 id="loading-title" class="loading-title">Opening the world…</h2>
            <p id="loading-detail" class="loading-detail">Loading the game. Your first visit may take a moment.</p>
            <noscript>Enable JavaScript to play Dodge Royale.</noscript>
          </div>
        </div>
      </section>

      <footer class="footer">
        <div id="controls" class="controls">
          <span class="controls-label">MOVE</span>
          <kbd>WASD</kbd><span>or</span><kbd aria-label="Arrow keys">↑ ← ↓ →</kbd>
          <kbd>R</kbd><span>recenter</span>
        </div>
        <div class="footer-actions">
          <button id="open-dashboard" type="button" data-dashboard-url="http://127.0.0.1:2718/">AI dashboard ↗</button>
          <button id="focus-game" type="button">Focus game ↗</button>
        </div>
      </footer>
    </main>

    <script type="module">
      const canvas = document.querySelector("#game");
      const loading = document.querySelector("#loading");
      const title = document.querySelector("#loading-title");
      const detail = document.querySelector("#loading-detail");
      const focusGame = () => canvas.focus({ preventScroll: true });

      document.querySelector("#focus-game").addEventListener("click", focusGame);
      const dashboard = document.querySelector("#open-dashboard");
      dashboard.addEventListener("click", () => {
        window.open(dashboard.dataset.dashboardUrl, "_blank", "noopener,noreferrer");
      });
      canvas.addEventListener("pointerdown", focusGame);

      // Winit uses this exception to hand its event loop over to the browser.
      // This is also handled by Bevy CLI's default HTML entry point.
      const isEventLoopControlFlow = (error) => error?.message?.startsWith(
        "Using exceptions for control flow, don't mind me. This isn't actually an error!"
      );

      function showError(error) {
        if (isEventLoopControlFlow(error)) return;
        loading.hidden = false;
        loading.classList.add("failed");
        title.textContent = "The world couldn’t load";
        detail.textContent = `Reload to try again. ${error?.message ?? String(error)}`;
        console.error(error);
      }

      // Render startup can fail after WebAssembly initialization has resolved.
      window.addEventListener("error", (event) => showError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => showError(event.reason));

      try {
        // Dynamic import also lets a missing or blocked module reach the error screen.
        const { default: init } = await import("./build/dodge-royale.js");
        await init().catch((error) => {
          if (!isEventLoopControlFlow(error)) throw error;
        });
        requestAnimationFrame(() => {
          if (!loading.classList.contains("failed")) loading.hidden = true;
          focusGame();
        });
      } catch (error) {
        showError(error);
      }
    </script>
  </body>
</html>
