default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.headless]
command = ["cargo", "clippy", "--locked", "--all-targets", "--no-default-features", "--", "-D", "warnings"]
need_stdout = false
